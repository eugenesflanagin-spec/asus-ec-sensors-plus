# /etc/modprobe.d/asus-ec-sensors-plus.conf
#
# OPTIONAL. Since 0.1.2 most people do not need this file: the default,
# bank_switch=-1 ("auto"), already turns bank switching on for boards known
# to need it (the TUF GAMING X870-PRO WIFI7 W NEO) and leaves every other
# board strictly read-only. Copy it to /etc/modprobe.d/ only to force a mode.
#
# bank_switch=1: always on. For each poll, switch the EC's bank register
#   (0xff) to 0, read the sensors, and put the original bank back - the same
#   thing the kernel's own asus-ec-sensors driver and LibreHardwareMonitor
#   always do. Nothing else is ever written.
# bank_switch=0: never write to the EC on any board (sensors show N/A while
#   the firmware has the EC on another bank).
# bank_switch=-1 (or auto): the default described above.
#
# After copying:  sudo modprobe -r asus_ec_sensors && sudo modprobe asus_ec_sensors
# Check:          cat /sys/module/asus_ec_sensors/parameters/bank_switch   (1)
#                 sudo dmesg | grep 'EC bank switching'
options asus_ec_sensors bank_switch=1
