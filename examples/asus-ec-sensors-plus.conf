# /etc/modprobe.d/asus-ec-sensors-plus.conf
#
# OPTIONAL. Copy this file to /etc/modprobe.d/ only if you want sensor values
# all the time on boards whose firmware often leaves the EC on another bank
# (for example the TUF GAMING X870-PRO WIFI7 W NEO).
#
# bank_switch=1: for each poll, switch the EC's bank register (0xff) to 0,
# read the sensors, and put the original bank back - the same thing the
# kernel's own asus-ec-sensors driver and LibreHardwareMonitor always do.
# Nothing else is ever written. Default (file not installed): 0 = never write.
#
# After copying:  sudo modprobe -r asus_ec_sensors && sudo modprobe asus_ec_sensors
# Check:          cat /sys/module/asus_ec_sensors/parameters/bank_switch   (Y)
options asus_ec_sensors bank_switch=1
